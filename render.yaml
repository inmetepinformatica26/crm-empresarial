databases:
  - name: crm-postgres
    plan: free
    databaseName: crm
    user: crm

services:
  - type: web
    name: crm-empresarial
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
